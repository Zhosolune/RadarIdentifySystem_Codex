[project]
name = "radar-identify-system"
version = "0.1.0"
description = "基于 PyQt6 的雷达信号识别桌面应用"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6==6.7.1",
    "PyQt6-Frameless-Window==0.8.1",
    "darkdetect==0.8.0",
    "matplotlib==3.10.9",
    "numpy==2.4.4",
    "onnxruntime==1.25.1",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
]

[dependency-groups]
test = [
    "pytest==9.1.0",
]
build = [
    "pyinstaller==6.22.2",
]

[tool.uv]
package = false
